name: Deploy to GitHub Pages

# Production (main) publishes to the site root; pull requests publish to
# /pr-preview/pr-<N>/ so each PR gets its own live preview URL. Both live on
# the gh-pages branch, which GitHub Pages serves ("Deploy from a branch").

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write        # push the built site to the gh-pages branch
  pull-requests: write   # post the preview URL as a PR comment

# Don't let concurrent runs race on the gh-pages branch.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Skip building on a PR close event — we only need the cleanup step below.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event.action != 'closed'
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: bun install --frozen-lockfile

      # `bun build` bundles src/ + three from the src/index.html entrypoint into
      # a self-contained dist/ (HTML + hashed JS/CSS, no runtime/CDN dependency)
      - name: Build site
        if: github.event.action != 'closed'
        run: bun run build

      # main -> gh-pages root (keep any existing PR previews intact)
      - name: Deploy production
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: pr-preview/

      # pull_request -> gh-pages/pr-preview/pr-<N>/ ; auto-removed when PR closes
      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
