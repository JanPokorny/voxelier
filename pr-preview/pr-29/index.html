<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14161b" />
    <title>Voxelier</title>
  <link rel="stylesheet" crossorigin href="./index-d94dhmwv.css"><script type="module" crossorigin src="./index-nwpjwn85.js"></script></head>
  <body>
    <div id="app" inert>
      <div id="stage">
        <canvas id="c"></canvas>
        <div id="measure"></div>
        <div id="tools"></div>
        <div id="compass" role="img" aria-label="Compass">
          <div class="crose">
            <span class="cn">N</span><span class="ce">E</span>
            <span class="cs">S</span><span class="cw">W</span>
            <i class="cneedle"></i>
          </div>
        </div>
      </div>

      <div id="side">
        <button id="btn-hide-side" class="sidetoggle" title="Hide sidebar">⟩</button>
        <h3>Scene</h3>
        <div id="docbar">
          <button id="btn-docs"
            title="Switch document">📁 <span id="docname">Project</span></button>
        </div>
        <div id="docslist" hidden></div>
        <div id="iobar">
          <button id="btn-save">💾 Save</button>
          <button id="btn-load">📂 Load</button>
        </div>
        <div id="tree"></div>
      </div>

      <button id="btn-show-side" class="sidetoggle" title="Show sidebar">⟨</button>
    </div>
    <button id="locked" hidden>Editing in another tab — click to move here</button>

    
  </body>
</html>
